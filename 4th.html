<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insights & History - CropSense</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-body: #f0f4f8;
            --bg-card: rgba(255, 255, 255, 0.85);
            --primary: #10b981;
            --primary-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: rgba(255, 255, 255, 0.6);
            --input-bg: rgba(255, 255, 255, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body {
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(at 0% 0%, hsla(153, 100%, 74%, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(210, 100%, 80%, 0.2) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
        }

        /* Navbar */
        nav {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { font-size: 1.5rem; font-weight: 700; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .nav-links { display: flex; gap: 30px; }
        .nav-links a { text-decoration: none; color: var(--text-muted); font-weight: 500; transition: all 0.3s; padding: 8px 12px; border-radius: 8px; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); background: rgba(16, 185, 129, 0.1); }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; animation: fadeIn 0.6s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            margin-bottom: 25px;
        }

        /* Header Area */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .page-title { font-size: 2rem; font-weight: 700; }
        
        .filters { display: flex; gap: 15px; }
        .form-control { padding: 10px 15px; border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; font-size: 0.95rem; background: var(--input-bg); outline: none; }
        .form-control:focus { border-color: var(--primary); }

        /* Data Table */
        .table-wrapper { overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; text-align: left; }
        .data-table th { background: rgba(0,0,0,0.02); padding: 15px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: color 0.3s; }
        .data-table th:hover { color: var(--primary); }
        .data-table td { padding: 15px; font-size: 0.95rem; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .data-table tbody tr { transition: background 0.2s; }
        .data-table tbody tr:hover { background-color: rgba(16, 185, 129, 0.05); }

        .badge { padding: 5px 12px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; }
        .badge-healthy { background: #dcfce7; color: #16a34a; }
        .badge-warn { background: #fee2e2; color: #ef4444; }

        .loader { text-align: center; padding: 40px; color: var(--text-muted); }
    </style>
</head>
<body>

    <nav>
        <a href="1st.html" class="logo" style="text-decoration:none;">🌾 CropSense</a>
        <div class="nav-links">
            <a href="1st.html">Dashboard</a>
            <a href="2nd.html">Field Analysis</a>
            <a href="3rd.html">Manage Fields</a>
            <a href="4th.html" class="active">History</a>
            <a href="5th.html">Satellite AI</a>
            <a href="6th.html">Plant Doctor</a>
            <a href="7th.html">Market AI</a>
            <a href="8th.html">Community Hub</a>
        </div>
        <div style="display: flex; gap: 15px; align-items: center; position: relative;">
            <a href="1st.html" style="text-decoration:none; width: 35px; height: 35px; border-radius: 50%; background: #e2e8f0; display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative;">
                🔔
            </a>
            <div style="width: 35px; height: 35px; border-radius: 50%; background: var(--primary-gradient); color: white; display: flex; justify-content: center; align-items: center; font-weight: bold;">AD</div>
        </div>
    </nav>

    <div class="container">
        <div class="top-bar">
            <h1 class="page-title">Historical Log & Data</h1>
            <div class="filters">
                <select id="fieldFilter" class="form-control" onchange="filterTable()">
                    <option value="all">All Fields</option>
                    <!-- Populated via JS -->
                </select>
                <button class="form-control" style="background:var(--primary-gradient); color:white; border:none; cursor:pointer;" onclick="window.print()">Export PDF</button>
            </div>
        </div>

        <div class="glass-card">
            <div class="table-wrapper">
                <table class="data-table" id="historyTable">
                    <thead>
                        <tr>
                            <th>Field Name</th>
                            <th>Crop</th>
                            <th>Date Updated</th>
                            <th>Temp (°C)</th>
                            <th>Humidity (%)</th>
                            <th>Soil Moisture</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="7" class="loader">Loading history from MongoDB...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        let allFields = [];

        async function initHistory() {
            try {
                const res = await fetch(`${API_BASE}/fields`);
                allFields = await res.json();
                populateFilter(allFields);
                renderTable(allFields);
            } catch(e) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="7" class="loader" style="color:red;">Error connecting to backend server.</td></tr>`;
            }
        }

        function populateFilter(fields) {
            const filter = document.getElementById('fieldFilter');
            fields.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.name;
                opt.textContent = f.name;
                filter.appendChild(opt);
            });
        }

        function renderTable(fields) {
            const tbody = document.getElementById('tableBody');
            let html = '';
            
            if(fields.length === 0) {
                html = `<tr><td colspan="7" class="loader">No historical data available.</td></tr>`;
                tbody.innerHTML = html;
                return;
            }

            fields.forEach(f => {
                const d = new Date(f.updatedAt).toLocaleString();
                const bClass = f.healthStatus === 'Healthy' ? 'badge-healthy' : 'badge-warn';
                html += `
                    <tr class="data-row" data-field="${f.name}">
                        <td style="font-weight:600;">${f.name}</td>
                        <td style="text-transform:capitalize;">${f.cropType}</td>
                        <td>${d}</td>
                        <td>${f.temperature}</td>
                        <td>${f.humidity}</td>
                        <td style="text-transform:capitalize;">${f.soilMoisture}</td>
                        <td><span class="badge ${bClass}">${f.healthStatus}</span></td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        function filterTable() {
            const filterVal = document.getElementById('fieldFilter').value;
            const rows = document.querySelectorAll('.data-row');
            
            rows.forEach(row => {
                if(filterVal === 'all' || row.dataset.field === filterVal) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        window.onload = initHistory;
    </script>
    <script src="global-alerts.js"></script>
</body>
</html>
