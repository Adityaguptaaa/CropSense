<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropSense | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-gradient: linear-gradient(135deg, #10b981, #059669);
            --bg-color: #f1f5f9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body { 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: url('https://images.unsplash.com/photo-1625246333195-78d9c38ad449?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.4), rgba(15, 23, 42, 0.8));
            z-index: 1;
        }

        .auth-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            color: white;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp { to { transform: translateY(0); opacity: 1; } }

        .logo { font-size: 2.2rem; font-weight: 700; text-align: center; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
        .subtitle { text-align: center; font-size: 1rem; opacity: 0.9; margin-bottom: 30px; }

        .tabs { display: flex; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.2); }
        .tab { flex: 1; text-align: center; padding: 10px; font-weight: 600; cursor: pointer; opacity: 0.6; transition: 0.3s; position: relative; }
        .tab.active { opacity: 1; }
        .tab.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 3px; background: var(--primary); border-radius: 3px 3px 0 0; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 8px; opacity: 0.9; }
        .form-control { width: 100%; padding: 14px 16px; font-size: 1rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white; transition: 0.3s; outline: none; }
        .form-control::placeholder { color: rgba(255,255,255,0.5); }
        .form-control:focus { border-color: var(--primary); background: rgba(255,255,255,0.15); box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }

        .btn-submit { width: 100%; padding: 15px; border-radius: 12px; background: var(--primary-gradient); border: none; color: white; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3); margin-top: 10px; }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(16, 185, 129, 0.4); }

        .error-box { display: none; background: rgba(239, 68, 68, 0.8); color: white; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; text-align: center; }

        .form-wrapper { display: none; }
        .form-wrapper.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo">🌾 CropSense</div>
        <div class="subtitle">AI-Powered Agricultural Intelligence</div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Login</div>
            <div class="tab" onclick="switchTab('register')">Sign Up</div>
        </div>

        <div id="errorBox" class="error-box">Invalid credentials</div>

        <!-- Login Form -->
        <div id="loginForm" class="form-wrapper active">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="farmer@cropsense.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit" id="loginBtn">Access Dashboard 🚀</button>
            </form>
        </div>

        <!-- Register Form -->
        <div id="registerForm" class="form-wrapper">
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" class="form-control" placeholder="Aditya Kumar" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="farmer@cropsense.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="Create a strong password" required minlength="6">
                </div>
                <button type="submit" class="btn-submit" id="regBtn">Create Account 🌟</button>
            </form>
        </div>
    </div>

    <script>
        // Check if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = '1st.html';
        }

        const errorBox = document.getElementById('errorBox');

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-wrapper').forEach(f => f.classList.remove('active'));
            errorBox.style.display = 'none';

            if(tab === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        function showError(msg) {
            errorBox.innerText = msg;
            errorBox.style.display = 'block';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerText = "Verifying...";
            
            try {
                const res = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value,
                        password: document.getElementById('loginPassword').value
                    })
                });
                const data = await res.json();
                
                if (data.error) throw new Error(data.error);
                
                // Save Token & User Info
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                window.location.href = '1st.html';
            } catch (err) {
                showError(err.message);
                btn.innerText = "Access Dashboard 🚀";
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('regBtn');
            btn.innerText = "Creating Account...";
            
            try {
                const res = await fetch('http://localhost:5000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('regName').value,
                        email: document.getElementById('regEmail').value,
                        password: document.getElementById('regPassword').value
                    })
                });
                const data = await res.json();
                
                if (data.error) throw new Error(data.error);
                
                // Save Token & User Info
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                window.location.href = '1st.html';
            } catch (err) {
                showError(err.message);
                btn.innerText = "Create Account 🌟";
            }
        }
    </script>
</body>
</html>
